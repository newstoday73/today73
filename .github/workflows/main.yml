| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;name=$(echo $svc \| cut -d: -f1); pidf=$(echo $svc \| cut -d: -f2)                                                                                                                                                                                                                                                                                                        |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;if kill -0 $(cat $pidf) 2>/dev/null; then \_pids="$\_pids $name=ok"; else \_pids="$\_pids $name=DEAD"; \_trouble=1; fi                                                                                                                                                                                                                                                    |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;done                                                                                                                                                                                                                                                                                                                                                                                  |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;if pgrep -f sb-dozor.json >/dev/null 2>&1; then \_pids="$\_pids sldozor=ok"; else \_pids="$\_pids sldozor=DEAD"; \_trouble=1; fi                                                                                                                                                                                                                                                      |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;(ss -tln 2>/dev/null \|\| netstat -tln 2>/dev/null) \| grep -q ":10086" \|\| { echo "vmess listen DEAD"; \_trouble=1; }                                                                                                                                                                                                                                                               |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;# Rebuild the monitor if it died or the hostname changed.                                                                                                                                                                                                                                                                                                                             |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;if ! pgrep -f sb-dozor.json >/dev/null 2>&1 \\                                                                                                                                                                                                                                                                                                                                        |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;\|\| [ "$(cat /tmp/sldozor.ep 2>/dev/null)" != "$CF_HOST" ]; then                                                                                                                                                                                                                                                                                                         |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;[ -n "$CF_HOST" ] && \_s2 "$CF_HOST"                                                                                                                                                                                                                                                                                                                                      |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;fi                                                                                                                                                                                                                                                                                                                                                                                    |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;if \_v3; then                                                                                                                                                                                                                                                                                                                                                                         |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;fail_cf=0                                                                                                                                                                                                                                                                                                                                                                 |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;if [ $((i % 4)) -eq 1 ]; then echo "public vmess end-to-end ok"; fi                                                                                                                                                                                                                                                                                                       |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;else                                                                                                                                                                                                                                                                                                                                                                                  |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;echo "public vmess end-to-end FAIL ($((fail_cf+1)))"; fail_cf=$((fail_cf+1)); \_trouble=1                                                                                                                                                                                                                                                                                 |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;fi                                                                                                                                                                                                                                                                                                                                                                                    |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;# --- auto-heal on FIRST failure: fresh tunnel + republish ---                                                                                                                                                                                                                                                                                                                        |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;if [ "$fail_cf" -ge 1 ]; then                                                                                                                                                                                                                                                                                                                                                         |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;if \_r4; then                                                                                                                                                                                                                                                                                                                                                             |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;CF_HOST="$(cat medvezhiy_sled.txt 2>/dev/null \| tr -d ' \r\n')"                                                                                                                                                                                                                                                                                              |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;\_s2 "$CF_HOST"                                                                                                                                                                                                                                                                                                                                               |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;if \_v3; then                                                                                                                                                                                                                                                                                                                                                 |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;\_p1 "heal"                                                                                                                                                                                                                                                                                                                                       |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;echo "HEALED: new tunnel $CF_HOST verified end-to-end"                                                                                                                                                                                                                                                                                            |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;else                                                                                                                                                                                                                                                                                                                                                          |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;echo "new tunnel up but traffic dead - will retry next round"                                                                                                                                                                                                                                                                                     |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;fi                                                                                                                                                                                                                                                                                                                                                            |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;else                                                                                                                                                                                                                                                                                                                                                                      |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;echo "tunnel restart failed - will retry next round"                                                                                                                                                                                                                                                                                                          |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;fi                                                                                                                                                                                                                                                                                                                                                                        |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;fail_cf=0                                                                                                                                                                                                                                                                                                                                                                 |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;fi                                                                                                                                                                                                                                                                                                                                                                                    |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;# Diagnostics ONLY on trouble (healthy loops stay one screen).                                                                                                                                                                                                                                                                                                                        |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;if [ "$\_trouble" -eq 1 ]; then                                                                                                                                                                                                                                                                                                                                                       |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;\_trouble=0                                                                                                                                                                                                                                                                                                                                                               |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;echo "--- ss.log tail ---"; tail -5 /tmp/ss.log \|\| true                                                                                                                                                                                                                                                                                                                 |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;echo "--- cf.log tail ---"; tail -10 /tmp/cf.log \|\| true                                                                                                                                                                                                                                                                                                                |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;echo "--- sb-dozitor.log tail ---"; tail -5 /tmp/sb-dozitor.log \|\| true                                                                                                                                                                                                                                                                                                 |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;fi                                                                                                                                                                                                                                                                                                                                                                                    |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;sleep 60                                                                                                                                                                                                                                                                                                                                                                              |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;done                                                                                                                                                                                                                                                                                                                                                                                              |
