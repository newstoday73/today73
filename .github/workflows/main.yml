| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;[ -z "$CF_HOST" ] && { echo "FATAL: no tunnel hostname"; exit 1; }                                                                                                                                                                                                                                                                                                                                |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;UUID="$(python3 -c "import json;print(json.load(open('matryoshka_dvigatel.json'))['inbounds'][0]['users'][0]['uuid'])")"                                                                                                                                                                                                                                                                          |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;printf '{"log":{"level":"info"},"inbounds":[{"type":"socks","tag":"in","listen":"127.0.0.1","listen_port":1082}],"outbounds":[{"type":"vmess","tag":"out","server":"%s","server_port":443,"uuid":"%s","alter_id":0,"tls":{"enabled":true,"server_name":"%s"},"transport":{"type":"ws","path":"/taiga","headers":{"Host":"%s"}}}]}' "$CF_HOST" "$UUID" "$CF_HOST" "$CF_HOST" > /tmp/sb-sled.json   |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;/tmp/sing-box run -c /tmp/sb-sled.json > /tmp/sb-cf.log 2>&1 &                                                                                                                                                                                                                                                                                                                                    |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;sleep 3                                                                                                                                                                                                                                                                                                                                                                                           |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;echo "--- vmess: http via socks-1082 (single probe, DNS-wait retry) ---"                                                                                                                                                                                                                                                                                                                          |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;# NOTE: fresh trycloudflare hostnames need 30-90s for DNS to                                                                                                                                                                                                                                                                                                                                      |
| &#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;&#x20;# propagate (NXDOMAIN right after creation is normal, NOT a bug).                                                                                                                                                                                                                                                                                                                                 |
